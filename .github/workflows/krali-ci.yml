name: KRALI CI

on:
  pull_request:
  push:
    branches:
      - "krali-*"

jobs:
  validate:
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate shell scripts
        shell: bash
        run: |
          set -euo pipefail
          for script in Scripts/*.command; do
            echo "Checking $script"
            /bin/zsh -n "$script"
          done

      - name: Select newest Xcode
        shell: bash
        run: |
          set -euo pipefail
          LATEST_XCODE="$(find /Applications -maxdepth 1 -type d -name 'Xcode*.app' | sort | tail -n 1)"
          if [ -n "$LATEST_XCODE" ]; then
            sudo xcode-select -s "$LATEST_XCODE/Contents/Developer"
          fi
          xcodebuild -version

      - name: Compile KRALI arm64 without code signing
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project App/KRALIAgentNative.xcodeproj \
            -scheme KRALIAgentNative \
            -configuration Debug \
            -derivedDataPath .ci-build \
            -destination 'platform=macOS,arch=arm64' \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

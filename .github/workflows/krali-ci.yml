name: KRALI CI

on:
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate shell scripts
        shell: bash
        run: |
          set -euo pipefail
          for script in Scripts/*.command; do
            echo "Checking $script"
            /bin/zsh -n "$script"
          done

      - name: Validate Node scripts
        shell: bash
        run: |
          set -euo pipefail
          for script in Scripts/*.mjs; do
            [ -e "$script" ] || continue
            echo "Checking $script"
            node --check "$script"
          done
          node Scripts/cursor-architect-bridge.mjs --self-test
          node Scripts/cloudflare-ollama-proxy.mjs --self-test
          node Scripts/developer-orchestration-policy-self-test.mjs
          node Scripts/developer-task-verifier.mjs --self-test
          node Scripts/openai-teacher-bridge.mjs --self-test
          node Scripts/developer-task-graph-self-test.mjs
          node Scripts/developer-task-decomposer.mjs --self-test
          node Scripts/developer-candidate-surface-guard.mjs --self-test
          node Scripts/provider-failover-self-test.mjs
          node Scripts/local-execution-profile-self-test.mjs
          node Scripts/scope-mutation-contract-self-test.mjs
          node Scripts/developer-semantic-node-verification-self-test.mjs
          node Scripts/developer-node-execution-state-self-test.mjs
          node Scripts/developer-active-node-recovery-contract-self-test.mjs
          node Scripts/developer-behavioral-orchestration-harness.mjs

      - name: Validate Swift mission and execution-profile policies
        shell: bash
        run: |
          set -euo pipefail
          swiftc \
            App/KRALIAgentNative/AgentMissionRouter.swift \
            Scripts/developer-mission-routing-self-test.swift \
            -o /tmp/krali-mission-router-self-test
          /tmp/krali-mission-router-self-test "$GITHUB_WORKSPACE"

          swiftc \
            App/KRALIAgentNative/AgentExecutionProfile.swift \
            Scripts/development-research-profile-self-test.swift \
            -o /tmp/krali-development-research-profile-self-test
          /tmp/krali-development-research-profile-self-test

      - name: Validate KRALI developer task cards
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob, json
          for path in glob.glob("DeveloperAgent/Tasks/*.json"):
              print(f"Checking {path}")
              with open(path, "r", encoding="utf-8") as f:
                  data = json.load(f)
              task = data.get("developerTask")
              assert isinstance(task, dict), f"{path}: developerTask missing"
              assert task.get("capabilityID"), f"{path}: capabilityID missing"
              assert task.get("developerBrief"), f"{path}: developerBrief missing"
              meta = data.get("taskMetadata") or {}
              verification = meta.get("verification")
              if verification is not None:
                  assert isinstance(verification, dict), f"{path}: verification must be object"
                  command = verification.get("command")
                  assert isinstance(command, list) and command and all(isinstance(x, str) and x for x in command), f"{path}: verification.command must be non-empty string array"
                  required_artifacts = verification.get("requiredArtifacts", [])
                  required_stdout = verification.get("requiredStdout", [])
                  assert isinstance(required_artifacts, list), f"{path}: requiredArtifacts must be array"
                  assert isinstance(required_stdout, list), f"{path}: requiredStdout must be array"
          PY

      - name: Select newest Xcode
        shell: bash
        run: |
          set -euo pipefail
          LATEST_XCODE="$(find /Applications -maxdepth 1 -type d -name 'Xcode*.app' | sort | tail -n 1)"
          if [ -n "$LATEST_XCODE" ]; then
            sudo xcode-select -s "$LATEST_XCODE/Contents/Developer"
          fi
          xcodebuild -version

      - name: Compile KRALI arm64 without code signing
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project App/KRALIAgentNative.xcodeproj \
            -scheme KRALIAgentNative \
            -configuration Debug \
            -derivedDataPath .ci-build \
            -destination 'platform=macOS,arch=arm64' \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build
